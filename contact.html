<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Alpha Digital</title>
  <meta name="description" content="Contact Alpha Digital — inquiries about books, rights, and partnerships.">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header container">
    <a class="brand" href="/">Alpha Digital</a>
  </header>
  <main class="container">
    <h1>Contact</h1>
    <p>For media, rights, or partnership inquiries, use the form below.</p>
    <form action="https://formspree.io/f/your-form-id" method="POST" class="contact-form">
      <label for="name">Name</label>
      <input id="name" name="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>
      <button class="btn" type="submit">Send message</button>
    </form>
  </main>
  <footer class="site-footer container">&copy; Alpha Digital</footer>
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
